[project]
name = "inverting-tpr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.10.1",
    "altair>=5.5.0",
    "anthropic>=0.66.0",
    "datasets>=3.1.0",
    "einops>=0.8.1",
    "gin-config>=0.5.0",
    "hypothesis>=6.135.14",
    "marimo==0.15.2",
    "matplotlib>=3.9.2",
    "modelbatch>=0.1.0",
    "nnsight==0.4.0",
    "numpy>=2.1.3",
    "optuna>=4.1.0",
    "pandas>=2.2.3",
    "plotly>=6.3.0",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "sentence-transformers>=4.0.1",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "transformers>=4.48.0",
    "vegafusion>=2.0.2",
    "vl-convert-python>=1.8.0",
    "wandb>=0.19.1",
]

[tool.marimo.runtime]
output_max_bytes = 50_000_000

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = ["-m", "not slow"]
markers = [
    "slow: marks tests as slow (e.g. running entire training scripts) (deselected by default)",
    "comprehensive: marks tests as comprehensive configuration testing (deselected by default)",
]

# Test execution modes:
# 
# Default mode (excludes comprehensive tests automatically):
#   uv run -m pytest
#
# Run only comprehensive tests:
#   uv run -m pytest -m comprehensive
#   uv run -m pytest tests/test_script_integration.py -m comprehensive
#
# Run all tests including comprehensive:
#   uv run -m pytest -m ""
#   uv run -m pytest tests/test_script_integration.py -m ""
#
# Run only fast basic tests (excludes both slow and comprehensive):
#   uv run -m pytest -m "not slow and not comprehensive"

project: layerwise-tpe-modelbatch-olmo-2-1124-13b
name: layerwise-tpe-modelbatch-olmo-2-1124-13b
method: bayes
metric:
  name: eval_loss_sum
  goal: minimize
parameters:
  tpe_lr:
    distribution: log_uniform_values
    min: 1e-4
    max: 5e-3
  tpe_batch:
    values: [64, 128, 256]
  tpe_epochs:
    values: [50, 75, 100]
  tpe_filler_dim:
    values: [64, 128]
  tpe_role_dim:
    values: [4, 8]
command:
  - ${env}
  - uv
  - run
  - scripts/wandb_script_launcher.py
  - experiments/layerwise_decoder_tpe/train_layerwise_tpe_modelbatch.py
  - experiments/layerwise_decoder_tpe/sweeps/layerwise_tpe_modelbatch_olmo_2_1124_13b.yaml
  - --tpe_lr=${tpe_lr}
  - --tpe_batch=${tpe_batch}
  - --tpe_epochs=${tpe_epochs}
  - --tpe_filler_dim=${tpe_filler_dim}
  - --tpe_role_dim=${tpe_role_dim}
gin_template: |
  # Layerwise ModelBatch TPE training (allenai/OLMo-2-1124-13B).
  main.sentences_path = 'data/sentences'
  main.embedding_cache_path = 'data/sentences'
  main.layer_indices = 'all'
  main.role_scheme = 'svo'
  main.random_seed = 7
  main.max_examples_per_split = None
  main.use_wandb = True
  main.wandb_project = 'layerwise-tpe-modelbatch-olmo-2-1124-13b'
  main.wandb_entity = None
  main.wandb_group = 'layerwise-tpe-modelbatch'
  main.wandb_run_name = None
  main.wandb_tags = ['decoder-only', 'layerwise', 'modelbatch', 'olmo-2-1124-13b']
  main.embedding_model_name = 'allenai/OLMo-2-1124-13B'

  AutoModelForCausalLM.from_pretrained.torch_dtype = 'bfloat16'

  main.tpe_config = {
      'filler_dim': $tpe_filler_dim,
      'role_dim': $tpe_role_dim,
      'aggregation': 'sum',
      'has_linear_layer': True,
  }

  main.tpe_training_args = @layerwise_tpe/TrainingArguments()
  layerwise_tpe/TrainingArguments.output_dir = 'experiments/layerwise_decoder_tpe/checkpoints/olmo-2-1124-13b_layers_all_modelbatch/run-$wandb_run_id'
  layerwise_tpe/TrainingArguments.learning_rate = $tpe_lr
  layerwise_tpe/TrainingArguments.per_device_train_batch_size = $tpe_batch
  layerwise_tpe/TrainingArguments.per_device_eval_batch_size = 256
  layerwise_tpe/TrainingArguments.num_train_epochs = $tpe_epochs
  layerwise_tpe/TrainingArguments.do_train = True
  layerwise_tpe/TrainingArguments.do_eval = True
  layerwise_tpe/TrainingArguments.load_best_model_at_end = True
  layerwise_tpe/TrainingArguments.metric_for_best_model = 'eval_loss'
  layerwise_tpe/TrainingArguments.greater_is_better = False
  layerwise_tpe/TrainingArguments.eval_strategy = 'epoch'
  layerwise_tpe/TrainingArguments.save_strategy = 'epoch'
  layerwise_tpe/TrainingArguments.save_total_limit = 1
  layerwise_tpe/TrainingArguments.save_safetensors = True
  layerwise_tpe/TrainingArguments.seed = 42
  layerwise_tpe/TrainingArguments.logging_strategy = 'steps'
  layerwise_tpe/TrainingArguments.logging_steps = 200
  layerwise_tpe/TrainingArguments.report_to = 'wandb'
  layerwise_tpe/TrainingArguments.lr_scheduler_type = 'cosine'
